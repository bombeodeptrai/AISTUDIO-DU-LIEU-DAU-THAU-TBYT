<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng phân tích thầu Y tế - Gia Lai & Toàn quốc</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9fa',
              100: '#dcf2f5',
              200: '#bde4eb',
              300: '#8ecfdb',
              400: '#56b1c4',
              500: '#3a95aa',
              600: '#327b8f',
              700: '#2d6576',
              800: '#2b5462',
              900: '#274753',
              950: '#152f39',
            },
            neutral: {
              50: '#fafaf9',
              100: '#f5f5f4',
              200: '#e7e5e4',
              300: '#d6d3d1',
              400: '#a8a29e',
              500: '#78716c',
              600: '#57534e',
              700: '#44403c',
              800: '#292524',
              900: '#1c1917',
              950: '#0c0a09',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- React CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      background-color: #f7f7f5;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f0;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #d6d3d1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #a8a29e;
    }
    .shimmer {
      background: linear-gradient(90deg, #f5f5f4 25%, #e7e5e4 50%, #f5f5f4 75%);
      background-size: 200% 100%;
      animation: shimmer-anim 1.5s infinite;
    }
    @keyframes shimmer-anim {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="font-sans antialiased text-neutral-800">

  <div id="root"></div>

  <!-- React code with Babel -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [tenders, setTenders] = useState([]);
      const [stats, setStats] = useState(null);
      const [loading, setLoading] = useState(true);
      const [statsLoading, setStatsLoading] = useState(true);
      
      // Filters
      const [search, setSearch] = useState('');
      const [province, setProvince] = useState('Toàn quốc');
      const [sort, setSort] = useState('date-desc');
      const [page, setPage] = useState(1);
      const [total, setTotal] = useState(0);
      const [limit] = useState(15);
      
      // Selected Tender Detail Modal
      const [selectedTenderId, setSelectedTenderId] = useState(null);
      const [tenderDetails, setTenderDetails] = useState(null);
      const [detailLoading, setDetailLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('overview');
      
      // AI Summarizer State
      const [aiSummary, setAiSummary] = useState('');
      const [aiLoading, setAiLoading] = useState(false);
      const [syncing, setSyncing] = useState(false);
      const [toast, setToast] = useState(null);
      const [lastSyncTime, setLastSyncTime] = useState(new Date().toLocaleTimeString('vi-VN'));
      const [tbmtInput, setTbmtInput] = useState('');
      const [tbmtSyncing, setTbmtSyncing] = useState(false);

      // Show toast helper
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 5000);
      };

      // Sync specific TBMT Code (e.g. IB2600421414)
      const handleSyncSingleTbmt = async (e) => {
        if (e) e.preventDefault();
        if (!tbmtInput.trim()) {
          showToast('Vui lòng nhập Mã TBMT (Ví dụ: IB2600421414)', 'error');
          return;
        }
        setTbmtSyncing(true);
        try {
          const res = await fetch('/api/tenders/sync-single', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: tbmtInput.trim() })
          });
          const result = await res.json();
          if (result.success) {
            showToast(result.message || `Đã quét và nạp gói thầu ${tbmtInput} thành công!`);
            setSearch(tbmtInput.trim().toUpperCase());
            setTbmtInput('');
            await fetchStats();
            await fetchTenders();
            setLastSyncTime(new Date().toLocaleTimeString('vi-VN'));
          } else {
            showToast(result.error || 'Không thể đồng bộ gói thầu này', 'error');
          }
        } catch (err) {
          console.error(err);
          showToast('Lỗi kết nối khi đồng bộ mã TBMT', 'error');
        } finally {
          setTbmtSyncing(false);
        }
      };

      // Trigger Rescan / Sync
      const handleSyncData = async () => {
        setSyncing(true);
        try {
          const res = await fetch('/api/crawler/sync', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ addNewBatches: 25 })
          });
          const result = await res.json();
          if (result.success) {
            await fetchStats();
            await fetchTenders();
            setLastSyncTime(new Date().toLocaleTimeString('vi-VN'));
            showToast(result.message || 'Đã quét và đồng bộ thành công các gói thầu mới!');
          } else {
            showToast('Không thể đồng bộ: ' + (result.error || 'Lỗi không xác định'), 'error');
          }
        } catch (err) {
          console.error('Lỗi khi đồng bộ:', err);
          showToast('Lỗi kết nối khi quét dữ liệu.', 'error');
        } finally {
          setSyncing(false);
        }
      };

      // Fetch Tenders List
      const fetchTenders = async () => {
        setLoading(true);
        try {
          const url = `/api/tenders?search=${encodeURIComponent(search)}&province=${encodeURIComponent(province)}&sort=${sort}&page=${page}&limit=${limit}`;
          const res = await fetch(url);
          const result = await res.json();
          setTenders(result.data || []);
          setTotal(result.total || 0);
        } catch (error) {
          console.error('Lỗi khi tải danh sách gói thầu:', error);
        } finally {
          setLoading(false);
        }
      };

      // Fetch stats
      const fetchStats = async () => {
        setStatsLoading(true);
        try {
          const res = await fetch('/api/stats');
          const data = await res.json();
          setStats(data);
          setLastSyncTime(new Date().toLocaleTimeString('vi-VN'));
        } catch (error) {
          console.error('Lỗi khi tải thống kê:', error);
        } finally {
          setStatsLoading(false);
        }
      };

      useEffect(() => {
        fetchStats();
      }, []);

      useEffect(() => {
        fetchTenders();
      }, [search, province, sort, page]);

      // Live background auto-polling every 12 seconds
      useEffect(() => {
        const interval = setInterval(async () => {
          try {
            const res = await fetch('/api/stats');
            const data = await res.json();
            if (data && data.totalCount !== stats?.totalCount) {
              setStats(data);
              fetchTenders();
              setLastSyncTime(new Date().toLocaleTimeString('vi-VN'));
            }
          } catch (e) {}
        }, 12000);
        return () => clearInterval(interval);
      }, [stats?.totalCount, search, province, sort, page]);

      // Debounce input helper or direct input search
      const handleSearchChange = (e) => {
        setSearch(e.target.value);
        setPage(1); // Reset page on query change
      };

      // Open Tender details
      const openTenderDetails = async (id) => {
        setSelectedTenderId(id);
        setTenderDetails(null);
        setAiSummary('');
        setActiveTab('overview');
        setDetailLoading(true);
        
        try {
          const res = await fetch(`/api/tenders/${id}`);
          if (res.ok) {
            const data = await res.json();
            setTenderDetails(data);
          } else {
            alert('Không tìm thấy thông tin chi tiết gói thầu này.');
            setSelectedTenderId(null);
          }
        } catch (error) {
          console.error('Lỗi tải chi tiết gói thầu:', error);
        } finally {
          setDetailLoading(false);
        }
      };

      // Generate AI summary
      const generateAISummary = async (id) => {
        setAiLoading(true);
        setAiSummary('');
        try {
          const res = await fetch(`/api/tenders/${id}/summarize`, { method: 'POST' });
          const result = await res.json();
          setAiSummary(result.summary || 'Không có kết quả.');
        } catch (error) {
          setAiSummary('Lỗi hệ thống khi sinh tóm tắt AI: ' + error.message);
        } finally {
          setAiLoading(false);
        }
      };

      // Render Lucide Icon Helper
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [tenders, stats, selectedTenderId, tenderDetails, detailLoading, aiSummary, aiLoading]);

      // Format currency to VND short scale
      const formatCurrency = (val) => {
        if (!val || val === 0) return '0 đ';
        if (val >= 1e9) {
          return `${(val / 1e9).toFixed(2)} tỷ VNĐ`;
        }
        return `${(val / 1e6).toFixed(0)} triệu VNĐ`;
      };

      const formatFullCurrency = (val) => {
        if (!val) return '0 đ';
        return val.toLocaleString('vi-VN') + ' đ';
      };

      return (
        <div id="main-container" class="min-h-screen flex flex-col bg-neutral-100">
          
          {/* Top Elegant Navbar */}
          <nav id="navbar" class="bg-neutral-900 text-white shadow-md border-b border-neutral-800 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                  <div class="p-2 bg-brand-600 rounded-lg text-white">
                    <i data-lucide="shield-alert" class="w-6 h-6"></i>
                  </div>
                  <div>
                    <h1 class="font-serif text-lg font-bold tracking-tight text-neutral-100 md:text-xl">
                      ANALYTICA Y TẾ <span class="font-sans font-light text-sm text-brand-300 ml-1">GIA LAI & TOÀN QUỐC</span>
                    </h1>
                    <p class="text-xs text-neutral-400 font-sans tracking-wide flex items-center space-x-2">
                      <span>Phân tích thông minh đấu thầu trang thiết bị y tế</span>
                      <span class="text-neutral-600">•</span>
                      <span class="text-emerald-400">Đồng bộ: {lastSyncTime}</span>
                    </p>
                  </div>
                </div>
                <div class="flex items-center space-x-3">
                  <div class="hidden sm:flex items-center space-x-1.5 text-xs text-emerald-400 font-sans px-3 py-1.5 bg-emerald-950/60 border border-emerald-800/60 rounded-full">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span>
                    <span>Tự động quét nền</span>
                  </div>
                  <div class="flex items-center space-x-1.5 text-xs text-neutral-300 font-sans px-3 py-1.5 bg-neutral-800 rounded-full border border-neutral-700">
                    <span class="w-2 h-2 bg-green-400 rounded-full"></span>
                    <span class="font-semibold">{stats?.totalCount || 0}</span>
                    <span class="text-neutral-400">Gói Thầu</span>
                  </div>
                  <button
                    onClick={handleSyncData}
                    disabled={syncing}
                    class="flex items-center space-x-1.5 text-xs font-semibold px-3.5 py-1.5 bg-brand-600 hover:bg-brand-500 text-white rounded-lg transition duration-150 shadow-sm disabled:opacity-50"
                  >
                    <i data-lucide={syncing ? "loader-2" : "refresh-cw"} class={`w-3.5 h-3.5 ${syncing ? "animate-spin" : ""}`}></i>
                    <span>{syncing ? "Đang quét..." : "Quét gói mới"}</span>
                  </button>
                </div>
              </div>
            </div>
          </nav>

          {/* Toast Notification Alert */}
          {toast && (
            <div class="fixed top-20 right-6 z-50 animate-bounce">
              <div class={`px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2 text-sm font-medium border ${
                toast.type === 'error' 
                  ? 'bg-red-900/90 text-red-100 border-red-700' 
                  : 'bg-emerald-900/95 text-emerald-100 border-emerald-700'
              }`}>
                <i data-lucide={toast.type === 'error' ? 'alert-triangle' : 'check-circle-2'} class="w-5 h-5 flex-shrink-0"></i>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* Core App Stage */}
          <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* High-End Stats Ribbon */}
            <div id="stats-ribbon" class="grid grid-cols-2 md:grid-cols-4 gap-4">
              {statsLoading ? (
                Array(4).fill(0).map((_, idx) => (
                  <div key={idx} class="shimmer h-24 rounded-xl border border-neutral-200"></div>
                ))
              ) : (
                <React.Fragment>
                  <div class="bg-white p-5 rounded-xl border border-neutral-200 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Gia Lai (Chuyên biệt)</span>
                      <div class="p-1 bg-amber-50 rounded-lg text-amber-600">
                        <i data-lucide="map-pin" class="w-5 h-5"></i>
                      </div>
                    </div>
                    <div class="mt-2 flex items-baseline space-x-2">
                      <span class="text-3xl font-bold text-neutral-900">{stats?.giaLaiCount}</span>
                      <span class="text-xs text-neutral-400">Gói thầu</span>
                    </div>
                  </div>

                  <div class="bg-white p-5 rounded-xl border border-neutral-200 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Gói Toàn Quốc</span>
                      <div class="p-1 bg-brand-50 rounded-lg text-brand-600">
                        <i data-lucide="globe" class="w-5 h-5"></i>
                      </div>
                    </div>
                    <div class="mt-2 flex items-baseline space-x-2">
                      <span class="text-3xl font-bold text-neutral-900">{stats?.otherCount}</span>
                      <span class="text-xs text-neutral-400">Gói thầu</span>
                    </div>
                  </div>

                  <div class="bg-white p-5 rounded-xl border border-neutral-200 shadow-sm flex flex-col justify-between col-span-1">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Giá Trị Dự Toán</span>
                      <div class="p-1 bg-emerald-50 rounded-lg text-emerald-600">
                        <i data-lucide="banknote" class="w-5 h-5"></i>
                      </div>
                    </div>
                    <div class="mt-2 flex items-baseline space-x-2">
                      <span class="text-2xl font-bold text-neutral-900">{formatCurrency(stats?.totalValue)}</span>
                    </div>
                  </div>

                  <div class="bg-white p-5 rounded-xl border border-neutral-200 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Tổng Số Gói Thầu</span>
                      <div class="p-1 bg-purple-50 rounded-lg text-purple-600">
                        <i data-lucide="database" class="w-5 h-5"></i>
                      </div>
                    </div>
                    <div class="mt-2 flex items-baseline space-x-2">
                      <span class="text-3xl font-bold text-neutral-900">{stats?.totalCount}</span>
                      <span class="text-xs text-neutral-400">Tổng kho</span>
                    </div>
                  </div>
                </React.Fragment>
              )}
            </div>

            {/* Dashboard Content split into sidebar stats and table */}
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
              
              {/* Left Column: Aggregated Lists & Quick Insights */}
              <div class="space-y-6 lg:col-span-1">
                
                {/* Hospital Activities Chart Card */}
                <div class="bg-white rounded-xl border border-neutral-200 shadow-sm p-5 space-y-4">
                  <div class="flex items-center space-x-2 pb-2 border-b border-neutral-100">
                    <i data-lucide="landmark" class="w-4 h-4 text-brand-600"></i>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-neutral-700">Chủ đầu tư tích cực nhất</h3>
                  </div>
                  {statsLoading ? (
                    <div class="space-y-3">
                      {Array(5).fill(0).map((_, i) => <div key={i} class="shimmer h-8 rounded-lg w-full"></div>)}
                    </div>
                  ) : (
                    <div class="space-y-3 text-xs">
                      {stats?.topHospitals?.map((h, i) => (
                        <div key={i} class="flex items-center justify-between p-2 rounded-lg bg-neutral-50 hover:bg-neutral-100 transition duration-150">
                          <span class="font-medium text-neutral-700 truncate max-w-[180px]" title={h.name}>{cleanBuyerName(h.name)}</span>
                          <span class="px-2 py-0.5 bg-brand-100 text-brand-700 font-semibold rounded-full">{h.count} gói</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Country of Origin Card */}
                <div class="bg-white rounded-xl border border-neutral-200 shadow-sm p-5 space-y-4">
                  <div class="flex items-center space-x-2 pb-2 border-b border-neutral-100">
                    <i data-lucide="factory" class="w-4 h-4 text-brand-600"></i>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-neutral-700">Xuất xứ thiết bị phổ biến</h3>
                  </div>
                  {statsLoading ? (
                    <div class="space-y-3">
                      {Array(5).fill(0).map((_, i) => <div key={i} class="shimmer h-8 rounded-lg w-full"></div>)}
                    </div>
                  ) : (
                    <div class="space-y-3 text-xs">
                      {stats?.topOrigins?.map((o, i) => (
                        <div key={i} class="flex items-center justify-between p-2 rounded-lg bg-neutral-50 hover:bg-neutral-100 transition duration-150">
                          <span class="font-medium text-neutral-700 truncate max-w-[180px]">{o.name}</span>
                          <span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 font-semibold rounded-full">{o.count} mục</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>

              {/* Right Column: Search Filtering & Primary Table of Tenders */}
              <div class="lg:col-span-3 space-y-6">
                
                {/* Muasamcong Direct Code Sync Banner */}
                <div class="bg-gradient-to-r from-amber-50/90 via-orange-50/60 to-amber-50/90 p-4 sm:p-5 rounded-xl border border-amber-200/80 shadow-sm">
                  <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                    <div class="space-y-1">
                      <div class="flex items-center space-x-2">
                        <span class="text-amber-600 font-bold text-sm flex items-center gap-1">
                          <i data-lucide="zap" class="w-4 h-4 text-amber-500 fill-amber-500"></i>
                          Đồng bộ & Cập nhật gói thầu trực tiếp từ Muasamcong
                        </span>
                      </div>
                      <p class="text-xs text-neutral-600 max-w-xl">
                        Hệ thống kết nối và quét đầy đủ chi tiết HSMT, danh mục máy móc, vật tư y tế và thông tin nhà thầu theo bất kỳ Mã thông báo mời thầu (TBMT) nào của bạn.
                      </p>
                    </div>
                    <form onSubmit={handleSyncSingleTbmt} class="flex items-center space-x-2 w-full md:w-auto">
                      <div class="relative flex-grow md:w-64">
                        <input
                          type="text"
                          value={tbmtInput}
                          onChange={(e) => setTbmtInput(e.target.value)}
                          placeholder="Nhập Mã TBMT (Ví dụ: IB2600421414)"
                          class="w-full pl-3 pr-3 py-2 text-xs font-mono bg-white border border-amber-300 rounded-lg shadow-inner outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-neutral-900 placeholder:text-neutral-400 uppercase"
                        />
                      </div>
                      <button
                        type="submit"
                        disabled={tbmtSyncing}
                        class="px-4 py-2 text-xs font-bold text-white bg-amber-700 hover:bg-amber-800 disabled:opacity-50 rounded-lg shadow transition duration-150 flex items-center space-x-1.5 whitespace-nowrap"
                      >
                        <i data-lucide={tbmtSyncing ? "loader-2" : "download-cloud"} class={`w-3.5 h-3.5 ${tbmtSyncing ? "animate-spin" : ""}`}></i>
                        <span>{tbmtSyncing ? "Đang quét..." : "Đồng bộ thầu"}</span>
                      </button>
                    </form>
                  </div>
                </div>

                {/* Filters Board */}
                <div class="bg-white p-5 rounded-xl border border-neutral-200 shadow-sm space-y-4">
                  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    
                    {/* Province selectors */}
                    <div class="flex items-center bg-neutral-100 p-1 rounded-xl w-fit">
                      {['Toàn quốc', 'Gia Lai', 'Tỉnh khác'].map((p) => (
                        <button
                          key={p}
                          onClick={() => { setProvince(p); setPage(1); }}
                          class={`px-4 py-2 text-xs font-semibold rounded-lg transition duration-150 whitespace-nowrap ${
                            province === p
                              ? 'bg-white text-neutral-900 shadow-sm'
                              : 'text-neutral-500 hover:text-neutral-950'
                          }`}
                        >
                          {p === 'Toàn quốc' ? 'Toàn bộ thầu' : p === 'Gia Lai' ? '🏥 Gia Lai' : 'Tỉnh khác'}
                        </button>
                      ))}
                    </div>

                    {/* Sorting selector */}
                    <div class="flex items-center space-x-2 text-xs">
                      <span class="text-neutral-400">Sắp xếp:</span>
                      <select
                        value={sort}
                        onChange={(e) => setSort(e.target.value)}
                        class="bg-neutral-50 border border-neutral-200 rounded-lg p-2 font-medium text-neutral-700 outline-none focus:border-brand-500"
                      >
                        <option value="date-desc">Mới nhất</option>
